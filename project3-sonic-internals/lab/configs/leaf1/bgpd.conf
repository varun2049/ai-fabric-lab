hostname leaf1
!
router bgp 65011
 bgp router-id 10.255.0.11
 no bgp ebgp-requires-policy
 neighbor 10.0.1.0 remote-as 65100
 neighbor 10.0.11.0 remote-as 65100
 !
 address-family ipv4 unicast
  network 10.255.0.11/32
  maximum-paths 8
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.1.0 activate
  neighbor 10.0.11.0 activate
  advertise-all-vni
 exit-address-family
!
