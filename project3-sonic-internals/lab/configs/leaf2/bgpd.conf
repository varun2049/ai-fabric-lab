hostname leaf2
!
router bgp 65012
 bgp router-id 10.255.0.12
 no bgp ebgp-requires-policy
 neighbor 10.0.2.0 remote-as 65100
 neighbor 10.0.12.0 remote-as 65100
 !
 address-family ipv4 unicast
  network 10.255.0.12/32
  maximum-paths 8
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.2.0 activate
  neighbor 10.0.12.0 activate
  advertise-all-vni
 exit-address-family
!
