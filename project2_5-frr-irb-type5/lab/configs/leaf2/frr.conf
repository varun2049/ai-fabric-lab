frr version 10.2.1
frr defaults datacenter
!
vrf tenantA
 vni 1000
exit-vrf
!
vrf tenantB
 vni 2000
exit-vrf
hostname leaf2
!
interface lo
 ip address 10.255.0.12/32
!
interface eth1
 ip address 10.0.2.1/31
!
interface eth2
!
interface eth3
 ip address 10.0.12.1/31
!
router bgp 65012
 bgp router-id 10.255.0.12
 no bgp ebgp-requires-policy
 neighbor 10.0.2.0 remote-as 65100
 neighbor 10.0.12.0 remote-as 65100
 !
 address-family ipv4 unicast
  network 10.255.0.12/32
  maximum-paths 8
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.2.0 activate
  neighbor 10.0.12.0 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65012 vrf tenantA
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
router bgp 65012 vrf tenantB
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
